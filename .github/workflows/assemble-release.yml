name: Assemble release binaries

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/assemble-release.yml'
      - '.binary_parts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild release archive and executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/seq-extract
          cat .binary_parts/part0 .binary_parts/part1 \
              .binary_parts/c00 .binary_parts/c01 .binary_parts/c02 .binary_parts/c03 \
              .binary_parts/c04 .binary_parts/c05 .binary_parts/c06 .binary_parts/c07 \
              .binary_parts/c08 .binary_parts/c09 .binary_parts/c10 .binary_parts/c11 \
              .binary_parts/c12 > /tmp/sequencecombiner-release.b64
          base64 -d /tmp/sequencecombiner-release.b64 > dist/SequenceCombiner_v1.2.1_Windows_x64.zip
          echo '0dcbaa89f8270e47c79b0d19025470f428fc94f8dacffaa9d1ff6289e9ccdecd  dist/SequenceCombiner_v1.2.1_Windows_x64.zip' | sha256sum -c -
          unzip -q dist/SequenceCombiner_v1.2.1_Windows_x64.zip -d /tmp/seq-extract
          cp /tmp/seq-extract/SequenceCombiner/SequenceCombiner.exe ./SequenceCombiner.exe
          echo '730371516e61ee8dbf7af1ded1d660f373846887f732a335bba00d36ecb38d14  SequenceCombiner.exe' | sha256sum -c -
          rm -rf .binary_parts

      - name: Commit assembled files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add SequenceCombiner v1.2.1 release binaries'
          git push

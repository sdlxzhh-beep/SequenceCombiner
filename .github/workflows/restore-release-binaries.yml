name: Restore release binaries

on:
  push:
    paths:
      - '.github/workflows/restore-release-binaries.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v1.2.1 package
        shell: bash
        run: |
          mkdir -p dist
          cat .binary_parts/part0 .binary_parts/part1 \
              .binary_parts/c00 .binary_parts/c01 .binary_parts/c02 .binary_parts/c03 \
              .binary_parts/c04 .binary_parts/c05 .binary_parts/c06 .binary_parts/c07 \
              .binary_parts/c08 .binary_parts/c09 .binary_parts/c10 .binary_parts/c11 \
              .binary_parts/c12 | base64 -d > dist/SequenceCombiner_v1.2.1_Windows_x64.zip
          echo "0dcbaa89f8270e47c79b0d19025470f428fc94f8dacffaa9d1ff6289e9ccdecd  dist/SequenceCombiner_v1.2.1_Windows_x64.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          p = 'dist/SequenceCombiner_v1.2.1_Windows_x64.zip'
          with zipfile.ZipFile(p) as z:
              data = z.read('SequenceCombiner/SequenceCombiner.exe')
          with open('SequenceCombiner.exe', 'wb') as f:
              f.write(data)
          PY
          echo "730371516e61ee8dbf7af1ded1d660f373846887f732a335bba00d36ecb38d14  SequenceCombiner.exe" | sha256sum -c -

      - name: Commit binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SequenceCombiner.exe dist/SequenceCombiner_v1.2.1_Windows_x64.zip
          git rm -r .binary_parts
          git commit -m "Add v1.2.1 Windows binaries [skip ci]"
          git push
